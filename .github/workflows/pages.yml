name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a queued run supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The site is generated from prior-art.json, so a stale or overclaiming
      # page is a test failure rather than something a reader has to catch.
      - name: Verify the site against the records
        run: |
          pip install pytest
          python -m pytest tests/test_site.py -q
      - name: Build
        run: python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
