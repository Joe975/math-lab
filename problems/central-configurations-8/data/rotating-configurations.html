/* Rigid relative equilibrium: q(t) = R(t)q(0), lambda = omega^2 = 1.
   Playback rate only maps wall-clock seconds to dimensionless physical time.
   This prescribes the relative equilibrium; it does not integrate perturbations. */
function rotateConfiguration(points, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return points.map(([x, y]) => [c * x - s * y, s * x + c * y]);
}
function advanceRotation(angle, elapsedSeconds, speed, playing) {
  if (!playing) return angle;
  return (angle + Math.max(0, elapsedSeconds) * speed * (2 * Math.PI / 10)) % (2 * Math.PI);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { rotateConfiguration, advanceRotation };
}

(() => {
  const root = document.getElementById('cc8-rotating-shapes');
  const configurations = JSON.parse(root.querySelector('#cc8-data').textContent);
  const select = root.querySelector('#cc8-choice');
  const speedInput = root.querySelector('#cc8-speed');
  const speedValue = root.querySelector('#cc8-speed-value');
  const play = root.querySelector('#cc8-play');
  const svg = root.querySelector('#cc8-stage');
  const guides = root.querySelector('#cc8-guides');
  const trails = root.querySelector('#cc8-trails');
  const bodies = root.querySelector('#cc8-bodies');
  const center = root.querySelector('#cc8-center');
  const status = root.querySelector('#cc8-status');
  const ns = 'http://www.w3.org/2000/svg';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reduced.matches, speed = 1, angle = 0, previous = null;
  let selected = configurations.find(c => c.id === 20), width = 0, height = 0, scale = 1;
  let dots = [], labels = [], paths = [];
  const extent = Math.max(...configurations.flatMap(c => c.points.map(p => Math.hypot(...p))));

  function element(tag, attrs, parent) {
    const el = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    parent.appendChild(el);
    return el;
  }
  configurations.forEach(config => {
    const option = document.createElement('option');
    option.value = config.id;
    option.textContent = `${config.id} · ${config.name}`;
    select.appendChild(option);
  });
  select.value = selected.id;

  function paint() {
    const rotated = rotateConfiguration(selected.points, angle);
    rotated.forEach(([x, y], i) => {
      const px = width / 2 + x * scale, py = height / 2 - y * scale;
      dots[i].setAttribute('cx', px);
      dots[i].setAttribute('cy', py);
      labels[i].setAttribute('x', px + 11);
      labels[i].setAttribute('y', py - 10);
      const segment = [];
      for (let k = 0; k <= 18; k++) {
        const a = angle - .65 * (1 - k / 18);
        const p = rotateConfiguration([selected.points[i]], a)[0];
        segment.push(`${k ? 'L' : 'M'}${width / 2 + scale * p[0]},${height / 2 - scale * p[1]}`);
      }
      paths[i].setAttribute('d', segment.join(' '));
    });
    svg.dataset.angle = String(angle);
  }
  function layout() {
    width = Math.max(260, svg.getBoundingClientRect().width);
    height = Math.min(440, width * .85);
    scale = (Math.min(width, height) / 2 - 32) / extent;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.style.height = `${height}px`;
    guides.replaceChildren();
    trails.replaceChildren();
    bodies.replaceChildren();
    dots = []; labels = []; paths = [];
    const radii = [];
    selected.points.forEach(p => {
      const r = Math.hypot(...p);
      if (r > 1e-6 && !radii.some(old => Math.abs(old-r) < 1e-6)) radii.push(r);
    });
    radii.forEach(r => element('circle', {cx: width/2, cy: height/2, r: r*scale, class: 'orbit-guide'}, guides));
    center.setAttribute('d', `M${width/2-5},${height/2}h10 M${width/2},${height/2-5}v10`);
    selected.points.forEach((_, i) => {
      paths.push(element('path', {class: 'trail'}, trails));
      dots.push(element('circle', {r: 6, class: 'mass'}, bodies));
      const label = element('text', {class: 'mass-label'}, bodies);
      label.textContent = i+1;
      labels.push(label);
    });
    status.textContent = `${selected.name} · 8 equal masses`;
    root.querySelector('#cc8-title').textContent = `${selected.name}: eight equal masses in rigid rotation`;
    svg.dataset.configuration = String(selected.id);
    paint();
  }
  select.addEventListener('change', () => {
    selected = configurations.find(c => c.id === Number(select.value));
    angle = 0;
    layout();
  });
  speedInput.addEventListener('input', () => {
    speed = Number(speedInput.value);
    speedValue.textContent = `${speed}×`;
  });
  function updatePlay() {
    play.textContent = playing ? 'Pause' : 'Play';
    play.setAttribute('aria-label', playing ? 'Pause rotation' : 'Play rotation');
  }
  play.addEventListener('click', () => { playing = !playing; previous = null; updatePlay(); });
  reduced.addEventListener('change', () => {
    if (reduced.matches) { playing = false; previous = null; updatePlay(); }
  });
  document.addEventListener('visibilitychange', () => { previous = null; });
  function tick(now) {
    if (!root.isConnected) return;
    if (previous !== null && !document.hidden) {
      angle = advanceRotation(angle, Math.min((now-previous)/1000, .1), speed, playing);
      if (playing) paint();
    }
    previous = now;
    requestAnimationFrame(tick);
  }
  new ResizeObserver(layout).observe(svg);
  updatePlay();
  layout();
  requestAnimationFrame(tick);
})();
  </script>
